name: Podfund
description: >-
  Podfund provides startup and growth capital to podcast creators and audio-driven
  media companies, typically investing $25,000 to $150,000 based on stage, track
  record, traction, and revenue. Operated by TechNexus Venture Collaborative, which
  has backed 600+ startups since 2007, Podfund pairs funding with business planning,
  a peer community, mentor matching, a growth toolkit, and partner offers. It was
  surfaced as a portfolio company of Bloomberg Beta and added to the API Evangelist
  network. Podfund publishes no public API, developer portal, or SDKs; this profile
  captures its identity and web presence for network discovery.
